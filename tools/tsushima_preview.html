<div id="tsushima-turn-view">
  <h3>日本海海戦・東郷ターン</h3>
  <div class="text-small">1905年5月27日／日本側時刻基準・推定航跡</div>
  <div class="viz-controls">
    <button type="button" class="btn" data-play>20倍速で再生</button>
    <label class="form-label">注目艦 <select class="form-select" data-ship></select></label>
  </div>
  <label class="form-label" for="tsushima-time">時刻 <output data-clock class="tabular-nums">14:05:00</output></label>
  <input id="tsushima-time" class="form-range" type="range" min="0" max="1200" value="300" step="1">
  <div class="viz-row text-small"><span><span class="jp-key">▲</span> 日本側12隻</span><span><span class="ru-key">◇</span> ロシア側12隻（二列を簡略化）</span></div>
  <svg class="battle-plot" role="img" aria-label="東を右、北を上にした推定航跡図。三笠から順に同じ回頭点を通過。距離単位は海里。"></svg>
  <div data-detail class="text-small tabular-nums"></div>
  <div data-event class="text-small" aria-live="polite"></div>
  <div class="text-small">地理的位置・艦間隔・旋回半径は推定。ロシア側の隊列合流・減速は未再現。</div>
</div>
<style>
#tsushima-turn-view .battle-plot {display:block;width:100%;height:560px;overflow:visible}
#tsushima-turn-view .battle-plot text {fill:var(--foreground);font-size:12px}
#tsushima-turn-view .jp-key {color:var(--viz-series-1)}
#tsushima-turn-view .ru-key {color:var(--viz-series-2)}
#tsushima-turn-view [data-detail],#tsushima-turn-view [data-event] {min-height:1.6em;overflow-wrap:anywhere}
</style>
<script>
(() => {
  const data = __TSUSHIMA_DATA__;
  const root = document.getElementById('tsushima-turn-view');
  const svg = root.querySelector('.battle-plot');
  const slider = root.querySelector('input');
  const select = root.querySelector('[data-ship]');
  const play = root.querySelector('[data-play]');
  const ns = 'http://www.w3.org/2000/svg';
  let seconds = 300, playing = false, previous = null;
  data.ships.forEach((ship, i) => {
    const option = document.createElement('option');
    option.value = i; option.textContent = ship.name; select.append(option);
  });
  const all = data.ships.flatMap(s => s.track);
  const xmin = Math.min(...all.map(p => p[0])) - 0.45;
  const xmax = Math.max(...all.map(p => p[0])) + 0.45;
  const ymin = Math.min(...all.map(p => p[1])) - 0.45;
  const ymax = Math.max(...all.map(p => p[1])) + 0.45;
  function node(tag, attrs, text) {
    const n = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v));
    if (text !== undefined) n.textContent = text;
    svg.append(n); return n;
  }
  function position(ship) {
    const t = seconds / 5, i = Math.floor(t), a = ship.track[i], b = ship.track[Math.min(i+1,240)], f = t-i;
    let dh = (b[2]-a[2]+540)%360-180;
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, (a[2]+dh*f+360)%360];
  }
  function draw() {
    const w = Math.max(300, svg.getBoundingClientRect().width), h = 560;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.replaceChildren();
    const scale = Math.min((w-76)/(xmax-xmin),(h-64)/(ymax-ymin));
    const pw = (xmax-xmin)*scale, ph = (ymax-ymin)*scale;
    const left = (w-pw)/2+12, top = 18;
    const x = v => left+(v-xmin)*scale, y = v => top+(ymax-v)*scale;
    node('rect',{x:left,y:top,width:pw,height:ph,fill:'none',stroke:'var(--border)'});
    for (let n=Math.ceil(ymin);n<=ymax;n+=2) {
      node('line',{x1:left,x2:left+pw,y1:y(n),y2:y(n),stroke:'var(--border)'});
      node('text',{x:left-8,y:y(n)+4,'text-anchor':'end'},n);
    }
    for (let n=Math.ceil(xmin);n<=xmax;n+=2) {
      node('line',{x1:x(n),x2:x(n),y1:top,y2:top+ph,stroke:'var(--border)'});
      node('text',{x:x(n),y:top+ph+18,'text-anchor':'middle'},n);
    }
    node('text',{x:left+pw/2,y:top+ph+40,'text-anchor':'middle'},'東西距離 [NM] → 東');
    node('text',{x:left-42,y:top+ph/2,transform:`rotate(-90 ${left-42} ${top+ph/2})`,'text-anchor':'middle'},'南北距離 [NM] → 北');
    const selected = Number(select.value);
    const trailIds = [...new Set([0,6,12,16,selected])];
    trailIds.forEach(i => {
      const ship = data.ships[i], pts = ship.track.slice(0,Math.floor(seconds/5)+1);
      pts.push(position(ship));
      node('polyline',{points:pts.map(p=>`${x(p[0])},${y(p[1])}`).join(' '),fill:'none',
        stroke:`var(--viz-series-${ship.side==='Japan'?1:2})`,'stroke-width':i===selected?2:1,
        'stroke-dasharray':ship.side==='Russia'?'4 3':'none',opacity:i===selected?1:0.5});
    });
    node('circle',{cx:x(0),cy:y(0),r:5,fill:'none',stroke:'var(--foreground)','stroke-dasharray':'2 2'});
    node('text',{x:x(0)-12,y:y(0)+40,'text-anchor':'end'},'回頭点（推定）');
    data.ships.forEach((ship,i)=>{
      const p=position(ship), japanese=ship.side==='Japan';
      node('path',{d:japanese?'M0,-7 L4,5 L-4,5 Z':'M0,-7 L4,0 L0,6 L-4,0 Z',
        transform:`translate(${x(p[0])},${y(p[1])}) rotate(${p[2]})`,
        fill:japanese?'var(--viz-series-1)':'var(--background)',
        stroke:`var(--viz-series-${japanese?1:2})`,'stroke-width':1.5});
      if(i===selected) {
        node('circle',{cx:x(p[0]),cy:y(p[1]),r:10,fill:'none',stroke:'var(--foreground)'});
        // Only the selected AIS name is labelled to avoid overlapping fleet labels.
        const right = x(p[0]) < w/2;
        node('text',{x:x(p[0])+(right?14:-14),y:y(p[1])-13,'text-anchor':right?'start':'end'},ship.ais);
      }
    });
    const total=Math.floor(seconds), minute=Math.floor(total/60), second=total%60;
    root.querySelector('[data-clock]').textContent=`14:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}`;
    const p=position(data.ships[selected]);
    const a=position(data.ships[0]), b=position(data.ships[12]);
    root.querySelector('[data-detail]').textContent=`${data.ships[selected].name} ／ 針路 ${p[2].toFixed(1)}° ／ 三笠–スヴォーロフ ${ (Math.hypot(a[0]-b[0],a[1]-b[1])*1.852).toFixed(2)} km（計算値）`;
    const event=data.events.filter(e=>e.time_sec<=seconds).at(-1);
    const line=root.querySelector('[data-event]');
    if(line.textContent!==event.label)line.textContent=event.label;
  }
  slider.addEventListener('input',()=>{seconds=Number(slider.value);draw()});
  select.addEventListener('change',draw);
  play.addEventListener('click',()=>{
    playing=!playing; previous=null;
    if(playing&&seconds>=1200)seconds=0;
    play.textContent=playing?'一時停止':'20倍速で再生';
  });
  function frame(now) {
    if(playing) {
      if(previous!==null)seconds=Math.min(1200,seconds+Math.min(now-previous,100)*0.02);
      slider.value=seconds; draw();
      if(seconds>=1200){playing=false;play.textContent='20倍速で再生'}
    }
    previous=now; requestAnimationFrame(frame);
  }
  new ResizeObserver(draw).observe(svg);
  draw(); requestAnimationFrame(frame);
})();
</script>

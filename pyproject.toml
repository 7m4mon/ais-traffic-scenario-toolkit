[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-traffic-scenario-toolkit"
version = "0.1.0"
description = "AIS encounter scenario compiler/player toolkit"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
websocket = []
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
